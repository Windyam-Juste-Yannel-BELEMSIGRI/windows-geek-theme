<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>geek-bar</title>
    <link rel="stylesheet" href="./icons.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root">
      <div class="app">
        <div class="left" id="left"></div>
        <div class="center" id="center"></div>
        <div class="right" id="right"></div>
      </div>
    </div>

    <script type="module">
      // Only runtime dependency: the Zebar client library (same import the official starter pack uses).
      import * as zebar from 'https://esm.sh/zebar@3.0';

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        memory: { type: 'memory' },
        network: { type: 'network' },
        battery: { type: 'battery' },
      });

      const $ = id => document.getElementById(id);
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }
      const icon = name => el('i', 'nf i-' + name);
      function item(cls, iconName, text, level) {
        const d = el('div', 'item ' + cls + (level ? ' ' + level : ''));
        d.append(icon(iconName), el('span', '', text));
        return d;
      }

      function networkIcon(net) {
        const t = net.defaultInterface?.type;
        if (t === 'ethernet') return 'ethernet';
        if (t === 'proprietary_virtual') return 'vpn';
        if (t === 'wifi') {
          const s = net.defaultGateway?.signalStrength ?? 0;
          if (s >= 80) return 'wifi4';
          if (s >= 65) return 'wifi3';
          if (s >= 40) return 'wifi2';
          if (s >= 25) return 'wifi1';
          return 'wifi0';
        }
        return 'wifi-off';
      }
      const batteryIcon = p => (p > 90 ? 'bat4' : p > 70 ? 'bat3' : p > 40 ? 'bat2' : p > 20 ? 'bat1' : 'bat0');
      const usageLevel = u => (u > 90 ? 'crit' : u > 80 ? 'warn' : '');

      function renderLeft(out) {
        const left = $('left');
        left.replaceChildren(el('i', 'nf i-windows logo'));
        if (!out.glazewm) return;
        const ws = el('div', 'workspaces');
        for (const w of out.glazewm.currentWorkspaces) {
          const b = el('button', 'ws' + (w.hasFocus ? ' focused' : '') + (w.isDisplayed ? ' displayed' : ''), w.displayName ?? w.name);
          b.onclick = () => out.glazewm.runCommand('focus --workspace ' + w.name);
          ws.append(b);
        }
        left.append(ws);
      }

      function renderRight(out) {
        const right = $('right');
        right.replaceChildren();
        const g = out.glazewm;
        if (g) {
          if (g.isPaused) {
            const p = el('button', 'btn paused');
            p.append(icon('pause'), el('span', '', 'PAUSED'));
            p.onclick = () => g.runCommand('wm-toggle-pause');
            right.append(p);
          }
          for (const m of g.bindingModes) {
            const b = el('button', 'btn mode', m.displayName ?? m.name);
            b.onclick = () => g.runCommand('wm-disable-binding-mode --name ' + m.name);
            right.append(b);
          }
          const dir = el('button', 'btn');
          dir.append(icon(g.tilingDirection === 'horizontal' ? 'swap-h' : 'swap-v'));
          dir.onclick = () => g.runCommand('toggle-tiling-direction');
          right.append(dir);
        }
        if (out.network) right.append(item('net', networkIcon(out.network), out.network.defaultGateway?.ssid ?? ''));
        if (out.memory) right.append(item('mem', 'memory', Math.round(out.memory.usage) + '%', usageLevel(out.memory.usage)));
        if (out.cpu) right.append(item('cpu', 'cpu', Math.round(out.cpu.usage) + '%', usageLevel(out.cpu.usage)));
        if (out.battery) {
          const p = Math.round(out.battery.chargePercent);
          right.append(item('bat', out.battery.isCharging ? 'plug' : batteryIcon(p), p + '%', !out.battery.isCharging && p <= 20 ? (p <= 10 ? 'crit' : 'warn') : ''));
        }
      }

      function renderClock() {
        const now = new Date();
        const c = el('div', 'clock');
        c.append(
          icon('clock'),
          el('span', '', ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })),
          el('span', 'date', now.toLocaleDateString([], { weekday: 'short', day: '2-digit', month: 'short' })),
        );
        $('center').replaceChildren(c);
      }

      function render() {
        const out = providers.outputMap;
        renderLeft(out);
        renderRight(out);
      }
      render();
      renderClock();
      providers.onOutput(render);
      setInterval(renderClock, 1000);
    </script>
  </body>
</html>
