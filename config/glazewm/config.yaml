# windows-geek-theme - GlazeWM config (tiling window manager). Based on the v3 defaults.
# Keys use ALT (never the Windows key) so Windows' own shortcuts keep working.
# Emergency exits: alt+shift+p (pause everything) / alt+shift+e (quit GlazeWM).

general:
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  # Focus the window under the mouse pointer without clicking.
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  # Space between two tiled windows.
  inner_gap: '12px'
  # Space between windows and the screen edge. Top leaves room for the floating Zebar bar.
  # Fullscreen windows (alt+f, F11, video, games) ignore these gaps.
  outer_gap:
    top: '54px'
    right: '12px'
    bottom: '12px'
    left: '12px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#00ff9c'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    # "Glass": native Windows layered-window opacity (no injection, no DWM patching). The wallpaper and the
    # animated HUD show through. alt+shift+o makes the focused window opaque until it is focused again
    # (GlazeWM re-applies these values on every focus change); alt+shift+g puts the glass back at once.
    # To turn the effect off for good: enabled: false on both blocks, then alt+shift+r.
    transparency:
      enabled: true
      opacity: '93%'
  other_windows:
    border:
      enabled: true
      color: '#1b3a33'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: true
      opacity: '86%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  # wofi-style launcher (alt+d): floating, centered, on top
  - commands: ['set-floating --centered --width 900px --height 520px --shown-on-top']
    match:
      - window_title: { regex: 'geek-launcher' }
        window_class: { equals: 'CASCADIA_HOSTING_WINDOW_CLASS' }

  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # Apps that open at exactly the screen size (Electron/WinUI apps like WhatsApp or Claude) are mistaken for
  # fullscreen windows by GlazeWM and cover the bar. Force every new window to start as a normal tiled window.
  # This runs only when a window is first managed: F11 / video fullscreen / alt+f keep working afterwards.
  # (Games: press alt+shift+p to pause GlazeWM, or add the game's process name to the ignore list above.)
  - commands: ['set-tiling']
    match:
      - window_process: { not_regex: '^(zebar|glazewm)$' }
        window_title: { not_regex: 'geek-launcher' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter']

keybindings:
  # Focus (vim keys or arrows)
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']
  - commands: ['focus --direction up']
    bindings: ['alt+k', 'alt+up']
  - commands: ['focus --direction down']
    bindings: ['alt+j', 'alt+down']

  # Move window
  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']

  # Resize
  - commands: ['resize --width -2%']
    bindings: ['alt+u']
  - commands: ['resize --width +2%']
    bindings: ['alt+p']
  - commands: ['resize --height +2%']
    bindings: ['alt+o']
  - commands: ['resize --height -2%']
    bindings: ['alt+i']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']

  # Window management
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-minimized']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+shift+q']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']

  # Glass effect of the focused window: opaque for a video or an image (lasts until the window is focused again)
  - commands: ['set-transparency --opacity 100%']
    bindings: ['alt+shift+o']
  - commands: ['set-transparency --opacity 93%']
    bindings: ['alt+shift+g']

  # Launch Windows Terminal
  - commands: ['shell-exec wt']
    bindings: ['alt+enter']

  # Workspaces
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+s']
  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+a']
  - commands: ['focus --recent-workspace']
    bindings: ['alt+z']
  # Next / previous workspace in order, empty ones included. These two are also what the touchpad four-finger
  # swipe sends (Settings > Touchpad > Advanced gestures > custom shortcut), see README.
  - commands: ['focus --next-workspace']
    bindings: ['ctrl+alt+right']
  - commands: ['focus --prev-workspace']
    bindings: ['ctrl+alt+left']

  # App launcher / search (wofi-like). Script: ~/.config/geek-launcher/launcher.ps1
  - commands: ['shell-exec wt.exe new-tab --title geek-launcher --suppressApplicationTitle -p "SOC // PowerShell 7" pwsh.exe -NoLogo -NoProfile -File "%USERPROFILE%\.config\geek-launcher\launcher.ps1"']
    bindings: ['lwin+d', 'alt+d']
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
